<body>
<header class="top"><div class="wrap in">
<a class="brand" href="/"><img src="/assets/chomik.webp" alt="" width="40" height="40">Chomik</a>
<nav class="links" aria-label="Main"><a href="/commands.html" aria-current="page">Commands</a><a href="/status.html">Status</a></nav>
<span class="sp"></span>
<a class="btn ghost sm" href="https://discord.gg/3emjVxAngm" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Support</a>
<a class="btn go sm" href="https://discord.com/oauth2/authorize?client_id=1493468057983778867" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Invite</a>
</div></header>
<main class="wrap">
<div class="ph"><h1>Com<em>mands</em></h1><p>Chomik works with slash commands. Click one for its usage, options and prefix versions.</p></div>
<div class="chead">
  <div class="srow">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search commands" aria-label="Search commands" autocomplete="off" spellcheck="false"></label>
    <div class="seg" id="seg" role="group" aria-label="View" data-v="list">
      <i class="thumb"></i>
      <button type="button" data-v="list" aria-label="List view" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button type="button" data-v="gallery" aria-label="Gallery view" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
    </div>
  </div>
  <div class="cats" id="cats" role="group" aria-label="Category"></div>
</div>
<ul class="cmds" id="cmds"></ul>
<p class="count" id="count"></p>
</main>
<dialog id="dlg" class="det" aria-label="Command details"></dialog>

</div></footer>
<script src="/assets/commands-data.js"></script>
<script src="/assets/site.js"></script>
<script>
(function(){
  var CH=window.CH, el=CH.el, $=CH.q, data=CH.data;
  var input=$('#q'), catsEl=$('#cats'), list=$('#cmds'), count=$('#count'), seg=$('#seg'), dlg=$('#dlg');
  var cat='All', view='list';
  try{ if(localStorage.getItem('chomik-view')==='gallery') view='gallery' }catch(e){}

  var names=['All'].concat(data.map(function(c){return c.category}).filter(function(v,i,a){return v&&a.indexOf(v)===i}).sort());
  var param=new URLSearchParams(location.search).get('cat'); if(param&&names.indexOf(param)>-1) cat=param;
  names.forEach(function(n){
    var b=el('button'); b.type='button'; b.textContent=n; b.dataset.n=n; b.setAttribute('aria-pressed',n===cat);
    if(n!=='All') b.style.setProperty('--c',CH.col(n));
    b.addEventListener('click',function(){
      if(cat===n) return; cat=n;
      catsEl.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
      render(true);
    });
    catsEl.appendChild(b);
  });

  function setView(v,anim){
    view=v; seg.dataset.v=v;
    seg.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v)});
    try{localStorage.setItem('chomik-view',v)}catch(e){}
    if(anim) render(true);
  }
  seg.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){if(view!==b.dataset.v) setView(b.dataset.v,true)})});

  function render(anim){
    var q=input.value.trim().toLowerCase().replace(/^\//,''), out=document.createDocumentFragment(), n=0;
    list.textContent=''; list.className='cmds'+(view==='gallery'?' gal':'');
    data.forEach(function(c,idx){
      if(cat!=='All'&&c.category!==cat) return;
      if(q&&(c.name+' '+(c.description||'')).toLowerCase().indexOf(q)<0) return;
      var li=el('li','cmd'); li.tabIndex=0; li.setAttribute('role','button'); li.dataset.i=idx;
      var np=(c.params||[]).length; li.dataset.n=np?np+(np===1?' option':' options'):'no options';
      if(anim&&n<16){li.classList.add('enter'); li.style.setProperty('--d',(n*26)+'ms')}
      li.style.setProperty('--c',CH.col(c.category));
      li.appendChild(el('small',0,c.category));
      li.appendChild(el('b',0,'/'+c.name));
      (c.params||[]).forEach(function(p){li.appendChild(el('em',0,' '+(p.required?'<'+p.name+'>':'['+p.name+']')))});
      li.appendChild(el('p',0,c.description||''));
      out.appendChild(li); n++;
    });
    list.appendChild(out);
    if(!n) list.appendChild(el('li','empty',data.length?'No commands match that.':'Command list failed to load.'));
    count.textContent=data.length?n+' of '+data.length+' commands · click one for details':'';
  }
  list.addEventListener('click',function(e){var li=e.target.closest('.cmd'); if(li) openDetails(+li.dataset.i)});
  list.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('cmd')){e.preventDefault(); openDetails(+e.target.dataset.i)}});
  input.addEventListener('input',function(){render(false)});
  addEventListener('keydown',function(e){if(e.key==='/'&&!/input|textarea/i.test(e.target.tagName||'')&&!dlg.open){e.preventDefault(); input.focus()}});

  /* details popup: usage, prefix version, options, copy */
  function openDetails(i){
    var c=data[i]; if(!c) return; var color=CH.col(c.category);
    dlg.textContent=''; dlg.style.setProperty('--c',color);
    var root=el('div','dbody');
    var x=el('button','x'); x.type='button'; x.setAttribute('aria-label','Close'); x.innerHTML='<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>'; x.addEventListener('click',function(){dlg.close()}); root.appendChild(x);
    root.appendChild(el('h2',0,'/'+c.name));
    root.appendChild(el('span','pill',c.category));
    root.appendChild(el('p','desc',c.description||''));
    root.appendChild(el('h3',0,'Usage'));
    var use=el('code','use'); use.appendChild(document.createTextNode('/'+c.name));
    (c.params||[]).forEach(function(p){use.appendChild(document.createTextNode(' ')); use.appendChild(el(p.required?'span':'i',0,p.required?p.name+':<value>':'['+p.name+':<value>]'))});
    root.appendChild(use);
    if(c.prefix&&c.prefix.length){
      root.appendChild(el('h3',0,'Prefix version'));
      root.appendChild(el('code','use',c.prefix.map(function(p){return ','+p}).join('   ')));
    }
    root.appendChild(el('h3',0,'Options'));
    if(!(c.params||[]).length) root.appendChild(el('p','desc','No options, just run it.'));
    (c.params||[]).slice().sort(function(a,b){return (b.required?1:0)-(a.required?1:0)}).forEach(function(p){
      var d=el('div','prm'); d.appendChild(el('span','rq'+(p.required?'':' o'),p.required?'required':'optional'));
      d.appendChild(el('b',0,p.name)); if(p.description) d.appendChild(el('p',0,p.description)); root.appendChild(d);
    });
    var act=el('div','dacts'), cp=el('button','btn ghost sm'); cp.type='button'; var lab=el('span',0,'Copy command'); cp.appendChild(lab);
    cp.addEventListener('click',function(){
      var t='/'+c.name, done=function(m){lab.textContent=m; setTimeout(function(){lab.textContent='Copy command'},1400)};
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){done('Copied!')},function(){done(t)});
    });
    act.appendChild(cp); root.appendChild(act); dlg.appendChild(root);
    if(!dlg.open){ if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','') }
    try{history.replaceState(null,'','?'+(cat!=='All'?'cat='+encodeURIComponent(cat):'')+'#'+encodeURIComponent(c.name))}catch(e){}
  }
  dlg.addEventListener('click',function(e){if(e.target===dlg) dlg.close()});
  dlg.addEventListener('close',function(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}});

  function fromHash(){
    var h=''; try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
    if(!h) return;
    for(var i=0;i<data.length;i++) if(data[i].name===h){openDetails(i); return}
  }
  addEventListener('hashchange',fromHash);
  setView(view,false); render(true); fromHash();
  if(!matchMedia('(max-width:900px)').matches) setTimeout(function(){if(!dlg.open) input.focus({preventScroll:true})},60);
})();
</script>
</body>
</html>
